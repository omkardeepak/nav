services:
  - type: web
    name: frontdesk
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: frontdesk-db
          property: connectionString
      - key: PGSSL
        value: "1"
      - key: AGENT_PASSWORD
        sync: false

databases:
  - name: frontdesk-db
    plan: free
    databaseName: frontdesk
    user: frontdesk

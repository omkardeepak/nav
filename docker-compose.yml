services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: frontdesk
      POSTGRES_PASSWORD: frontdesk
      POSTGRES_DB: frontdesk
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U frontdesk -d frontdesk"]
      interval: 2s
      timeout: 5s
      retries: 10
      start_period: 2s

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://frontdesk:frontdesk@db:5432/frontdesk
      PORT: 3000
      AGENT_PASSWORD: frontdesk
    ports:
      - "3000:3000"
    volumes:
      - ./public:/app/public:ro
      - ./src:/app/src:ro
      - ./test:/app/test:ro
      - ./schema.sql:/app/schema.sql:ro

  test:
    profiles:
      - test
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://frontdesk:frontdesk@db:5432/frontdesk
      AGENT_PASSWORD: frontdesk
    volumes:
      - ./public:/app/public:ro
      - ./src:/app/src:ro
      - ./test:/app/test:ro
      - ./schema.sql:/app/schema.sql:ro
    command: ["npm", "test"]

volumes:
  db-data:
